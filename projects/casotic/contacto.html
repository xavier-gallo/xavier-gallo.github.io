<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Casotic - Contacto</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#256a74",
                        "secondary": "#4A5568",
                        "background-light": "#F2F4F5",
                        "background-dark": "#141d1e",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    }
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
    <!-- Header -->
    <header class="flex items-center justify-between border-b border-primary/10 px-6 py-4 bg-white dark:bg-background-dark sticky top-0 z-50">
        <div class="flex items-center gap-8">
            <div class="flex items-center gap-4 text-primary cursor-pointer" onclick="window.location.href='index.html'">
                <span class="material-symbols-outlined text-3xl">dataset</span>
                <h2 class="text-xl font-bold">Casotic</h2>
            </div>
            <nav class="hidden md:flex items-center gap-6">
                <a class="hover:text-primary transition-colors text-sm font-medium" href="empresas.html">Empresas</a>
                <a class="hover:text-primary transition-colors text-sm font-medium" href="marketplace.html">Marketplace</a>
            </nav>
        </div>
        <div class="flex flex-1 justify-end gap-6 items-center">
            <div id="auth-buttons"></div>
        </div>
    </header>

    <main class="flex-1 w-full max-w-2xl mx-auto px-6 py-12">
        <div class="bg-white dark:bg-slate-900 rounded-2xl p-8 border border-primary/10 shadow-sm">
            <h1 class="text-3xl font-black mb-2">Contáctanos</h1>
            <p class="text-slate-600 mb-8">¿Tienes alguna duda o necesitas ayuda con la plataforma? Escríbenos.</p>
            
            <form onsubmit="handleContact(event)" class="space-y-6">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">Nombre</label>
                        <input type="text" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-primary focus:border-primary outline-none" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Email</label>
                        <input type="email" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-primary focus:border-primary outline-none" required>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Asunto</label>
                    <input type="text" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-primary focus:border-primary outline-none" required>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Mensaje</label>
                    <textarea rows="5" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-primary focus:border-primary outline-none" required></textarea>
                </div>
                <button type="submit" class="w-full bg-primary text-white font-bold py-3 px-4 rounded-lg hover:bg-primary/90 transition-colors">Enviar Mensaje</button>
            </form>
        </div>
    </main>

    <footer class="mt-12 py-8 text-center text-slate-500 border-t border-primary/10">
        <p>© 2024 Casotic Intelligence. All rights reserved.</p>
    </footer>

    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/i18n.js"></script>
    <script>
        function handleContact(e) {
            e.preventDefault();
            alert('¡Gracias por tu mensaje! Nuestro equipo se pondrá en contacto contigo pronto.');
            e.target.reset();
        }
    </script>
</body>
</html>
